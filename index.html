<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IngenevoTools — Help</title>
  <meta name="description" content="Dokumentasi pengguna untuk plugin BricsCAD IngenevoTools. User documentation for IngenevoTools BricsCAD plugin." />

  <!-- Docsify Dark/Light Theme -->
  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/style.min.css"
    title="docsify-darklight-theme"
    type="text/css"
  />

  <!-- Custom overrides -->
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #42b983;
    }
    /* Sidebar brand */
    .app-name-link {
      font-weight: 700 !important;
      letter-spacing: 0.02em;
    }
    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }
    /* Command title styling */
    h1 code {
      font-size: 1em;
      background: none;
      color: inherit;
    }
    /* Screenshot placeholder */
    .screenshot-placeholder {
      border: 2px dashed var(--theme-color);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      color: #888;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div id="app">Memuat dokumentasi...</div>

  <script>
    window.$docsify = {
      name: 'IngenevoTools',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      basePath: window.location.pathname.replace(/\/[^\/]*$/, '/'),

      // Search plugin config
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/en/': 'Search...',
          '/': 'Cari...',
        },
        noData: {
          '/en/': 'No results found',
          '/': 'Tidak ditemukan',
        },
        depth: 3,
        hideOtherSidebarContent: false,
      },

      // Pagination
      pagination: {
        previousText: 'Sebelumnya',
        nextText: 'Selanjutnya',
        crossChapter: true,
        crossChapterText: true,
      },

      // Dark/Light theme
      darklightTheme: {
        siteFont: 'Source Sans Pro, Helvetica Neue, Arial, sans-serif',
        defaultTheme: 'dark',
        themeColor: '#42b983',
        dark: {
          accent: '#42b983',
          toogleBackground: '#ffffff',
          background: '#1e1e1e',
          textColor: '#b4b4b4',
          codeTextColor: '#ffffff',
          codeBackgroundColor: '#0d1117',
          borderColor: '#0d1117',
          blockQuoteColor: '#858585',
          highlightColor: '#d22778',
          sidebarSublink: '#b4b4b4',
          codeTypeColor: '#ffffff',
          coverBackground: 'linear-gradient(to left bottom, hsl(118, 60%, 30%) 0%, hsl(58, 80%, 40%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/icons/sun.svg)',
        },
        light: {
          accent: '#42b983',
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#34495e',
          codeTextColor: '#525252',
          codeBackgroundColor: '#f8f8f8',
          borderColor: 'rgba(0, 0, 0, 0.07)',
          blockQuoteColor: '#858585',
          highlightColor: '#d22778',
          sidebarSublink: '#505d6b',
          codeTypeColor: '#091a28',
          coverBackground: 'linear-gradient(to left bottom, hsl(118, 60%, 50%) 0%, hsl(58, 100%, 60%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/icons/moon.svg)',
        },
      },
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
